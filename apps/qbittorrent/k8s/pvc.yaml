## Static NFS PersistentVolumes pointing to existing NAS paths.
## Replace 10.0.0.41 with your NAS's IP address.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-gluetun-config
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  nfs:
    server: 10.0.0.41
    path: /volume1/docker/gluetun
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gluetun-config
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  volumeName: qbittorrent-gluetun-config
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-config
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  nfs:
    server: 10.0.0.41
    path: /volume1/docker/qbittorrent
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeName: qbittorrent-config
  storageClassName: ""
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: qbittorrent-torrents
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 10.0.0.41
    path: /volume1/torrents
  persistentVolumeReclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: torrents
  namespace: qbittorrent
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  volumeName: qbittorrent-torrents
  storageClassName: ""
